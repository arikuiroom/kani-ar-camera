<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>カニギターARカメラ Beta v0.1.1</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100svh; background: #111; color: #fff;
      display: grid; place-items: center; padding: 24px;
    }
    main { width: min(100%, 420px); text-align: center; }
    h1 { font-size: 28px; margin: 0 0 8px; }
    .version { opacity: .55; font-size: 13px; margin-bottom: 28px; }
    .card {
      background: #1c1c1e; border: 1px solid #333; border-radius: 24px;
      padding: 28px 22px;
    }
    .shape {
      width: 110px; height: 110px; margin: 0 auto 24px; border-radius: 24px;
      background: linear-gradient(145deg,#f44,#a00);
      display:grid; place-items:center; font-size:52px;
      box-shadow: 0 12px 40px rgba(0,0,0,.35);
    }
    p { line-height: 1.65; color: #d7d7dc; margin: 0 0 22px; }
    a[rel="ar"] {
      display: flex; align-items:center; justify-content:center;
      width: 100%; min-height: 58px; border-radius: 16px;
      background: #fff; color: #111; text-decoration: none;
      font-weight: 700; font-size: 18px;
    }
    .note { margin-top: 18px; font-size: 13px; color: #8e8e93; line-height: 1.55; }
    #support { margin-top: 12px; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>カニギターARカメラ</h1>
    <div class="version">Beta v0.1.1</div>

    <section class="card">
      <div class="shape" aria-hidden="true">◆</div>
      <p>
        最小ARテストです。<br>
        iPhoneでボタンを押し、周囲を映して床を認識させ、
        テスト用3Dオブジェクトを配置できるか確認します。
      </p>

      <a
        rel="ar"
        href="https://developer.apple.com/quick-look-gallery/models/rover/LunarRover_English.reality"
        id="ar-link"
      >
        <img
          src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="
          alt=""
          width="1"
          height="1"
          style="position:absolute;opacity:0;pointer-events:none"
        />
        ARを開始
      </a>

      <div id="support"></div>
      <div class="note">
        Apple AR Quick Lookを使用しています。<br>
        Safariから開いてください。
      </div>
    </section>
  </main>

  <script>
    const support = document.getElementById('support');
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    const isSafari = /^((?!chrome|android|crios|fxios).)*safari/i.test(navigator.userAgent);
    if (!isIOS) {
      support.textContent = 'このBetaはiPhone / iPadで確認してください。';
      support.style.color = '#ff9f0a';
    } else if (!isSafari) {
      support.textContent = 'Safariで開くことをおすすめします。';
      support.style.color = '#ff9f0a';
    } else {
      support.textContent = 'AR Quick Look対応環境です。';
      support.style.color = '#30d158';
    }
  </script>
</body>
</html>
